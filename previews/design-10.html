<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%}
body{font-family:Sora,sans-serif;background:#0d0519;color:#f5f0ff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 10%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 35%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 25% 55%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 48% 85%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 62% 60%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 92% 75%,#fff5 50%,transparent 51%)}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;z-index:3}
.logo{font-family:Fraunces;font-weight:600;font-size:26px;background:linear-gradient(90deg,#c9a2ff,#e6c15c);-webkit-background-clip:text;background-clip:text;color:transparent}
.signin{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e9e2fa;padding:10px 22px;border-radius:999px;font-size:14px}
.sys{position:relative;width:560px;height:560px;margin-bottom:20px}
.orbit{position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}
.o1{inset:12%}.o2{inset:0}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a55ef0,#3d1c80 70%);display:grid;place-items:center;text-align:center;box-shadow:0 0 100px rgba(124,58,237,.8),inset 0 0 40px rgba(0,0,0,.3);border:1px solid rgba(230,193,92,.4)}
.core h1{font-family:Fraunces;font-weight:400;font-size:40px;line-height:1.1}
.core h1 em{font-style:italic;color:#e6c15c}
.mate{position:absolute;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:20px;background:linear-gradient(135deg,#6d3bd8,#2f5fe8);border:2px solid rgba(255,255,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mate.g{background:linear-gradient(135deg,#e6c15c,#b98a2e);color:#241238}
.m1{left:50%;top:2%;transform:translateX(-50%)}
.m2{right:6%;top:26%}
.m3{right:14%;bottom:12%}
.m4{left:50%;bottom:0;transform:translateX(-50%)}
.m5{left:14%;bottom:12%}
.m6{left:6%;top:26%}
.tag{position:relative;z-index:2;color:#b7a8de;font-weight:300;font-size:15px;margin-bottom:30px;text-align:center}
.tag b{color:#e6c15c;font-weight:500}
.input{position:relative;z-index:2;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:999px;padding:10px 10px 10px 28px;width:640px}
.ph{flex:1;text-align:left;color:#a89bd0;font-size:15px}
.mic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.09);display:grid;place-items:center}
.cta{background:linear-gradient(90deg,#e6c15c,#d4a437);color:#241238;font-weight:600;border-radius:999px;padding:15px 22px;font-size:15px;white-space:nowrap}
</style></head><body>
<div class="stars"></div>
<nav><div class="logo">Noorizq</div><div class="signin">Sign in</div></nav>
<div class="sys">
<div class="orbit o1"></div><div class="orbit o2"></div>
<div class="core"><h1>Give Noor<br><em>one thing.</em></h1></div>
<div class="mate g m1">N</div><div class="mate m2">L</div><div class="mate m3">I</div><div class="mate m4">S</div><div class="mate m5">H</div><div class="mate g m6">Y</div>
</div>
<div class="tag">One sentence — and <b>six teammates</b> assemble your company in orbit around it.</div>
<div class="input"><div class="ph">I'm an ops manager with no idea</div><div class="mic">◉</div><div class="cta">Assemble my company →</div></div>
</body></html>
