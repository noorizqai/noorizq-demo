<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%}
body{font-family:Sora,sans-serif;background:radial-gradient(120% 100% at 50% 0%,#2a1150 0%,#160829 55%,#0d0518 100%);color:#f5f0ff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 15% 20%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 75% 15%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 42%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 28% 60%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 55% 88%,#fff6 50%,transparent 51%)}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 44px}
.logo{font-family:Fraunces;font-weight:600;font-size:26px;background:linear-gradient(90deg,#c9a2ff,#e6c15c);-webkit-background-clip:text;background-clip:text;color:transparent}
.signin{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#e9e2fa;padding:10px 22px;border-radius:999px;font-size:14px}
h1{font-family:Fraunces;font-weight:400;font-size:54px;margin-bottom:6px}
h1 em{font-style:italic;color:#e6c15c}
.tag{color:#b7a8de;font-weight:300;font-size:15px;margin-bottom:34px}
.orbwrap{position:relative;width:300px;height:300px;display:grid;place-items:center;margin-bottom:30px}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(230,193,92,.35);animation:pulse 3s ease-out infinite}
.r2{animation-delay:1.5s}
@keyframes pulse{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.orb{width:230px;height:230px;border-radius:50%;background:conic-gradient(from 200deg,#7c3aed,#2f5fe8,#e6c15c,#a55ef0,#7c3aed);filter:blur(.4px);display:grid;place-items:center;box-shadow:0 0 90px rgba(124,58,237,.75),0 0 160px rgba(47,95,232,.4),inset 0 0 60px rgba(0,0,0,.35)}
.core{width:150px;height:150px;border-radius:50%;background:rgba(13,5,24,.72);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:40px}
.bars{position:absolute;bottom:-6px;display:flex;gap:5px}
.bars i{width:4px;border-radius:3px;background:#e6c15c;animation:eq 1.1s ease-in-out infinite}
.bars i:nth-child(1){height:12px}.bars i:nth-child(2){height:22px;animation-delay:.15s}.bars i:nth-child(3){height:30px;animation-delay:.3s}.bars i:nth-child(4){height:18px;animation-delay:.45s}.bars i:nth-child(5){height:10px;animation-delay:.6s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.speak{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#e6c15c;margin-bottom:26px}
.type{display:flex;align-items:center;gap:14px;width:520px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:999px;padding:14px 22px;color:#9f92c4;font-size:14px}
.type .k{flex:1;text-align:left}
.send{color:#e6c15c}
</style></head><body>
<div class="stars"></div>
<nav><div class="logo">Noorizq</div><div class="signin">Sign in</div></nav>
<h1>Say <em>one thing.</em></h1>
<div class="tag">Noor assembles your company the moment you speak.</div>
<div class="orbwrap"><div class="ring"></div><div class="ring r2"></div><div class="orb"><div class="core">◉</div></div><div class="bars"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="speak">Tap to speak</div>
<div class="type"><div class="k">…or type it instead</div><div class="send">→</div></div>
</body></html>
