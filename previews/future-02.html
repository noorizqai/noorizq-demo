<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Caveat:wght@500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:Sora,sans-serif;background:#160b38;color:#f5f0ff;min-height:100vh;overflow-x:hidden}
.logo{position:absolute;top:26px;left:36px;font-family:Fraunces,serif;font-weight:600;font-size:24px;color:#e9c98a;letter-spacing:.5px}
.signin{position:absolute;top:30px;right:36px;font-size:13px;color:#cfc6ee;border:1px solid rgba(233,201,138,.35);border-radius:999px;padding:7px 18px}
.badge{position:absolute;top:32px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:#8f83b8;text-transform:uppercase}
.dust{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(233,201,138,.14) 1px,transparent 1.4px);background-size:90px 90px}
h1{font-family:Fraunces,serif;font-weight:400;font-size:44px;text-align:center}
h1 em{font-style:italic;color:#e9c98a}
.sub{text-align:center;color:#b7a8de;font-size:15px;margin-top:10px}
.hand{font-family:Caveat,cursive}
</style></head><body>
<div class="dust"></div><div class="logo">Noorizq</div><div class="badge">02 · Ambient ink</div><div class="signin">Sign in</div>
<div style="text-align:center;padding-top:80px"><h1>One drop of <em>intent.</em></h1>
<div class="sub">Speak and the ink answers: your voice stirs the orb, and your brand bleeds out of it onto the page.</div></div>
<div style="position:relative;width:1000px;height:480px;margin:8px auto 0">
<svg style="position:absolute;left:50%;top:0;transform:translateX(-50%)" width="1000" height="480" viewBox="0 0 1000 480" fill="none">
<defs><radialGradient id="orb" cx="42%" cy="38%" r="75%"><stop offset="0" stop-color="#c9a24d"/><stop offset=".38" stop-color="#8b3ff0"/><stop offset="1" stop-color="#1e1145"/></radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8b3ff0" stop-opacity=".5"/><stop offset="1" stop-color="#8b3ff0" stop-opacity="0"/></radialGradient></defs>
<circle cx="500" cy="215" r="190" fill="url(#halo)"/>
<circle cx="500" cy="215" r="118" fill="url(#orb)"/>
<path d="M410 190 q60 -55 150 -18 q-40 66 -118 60 q-40 -4 -32 -42Z" fill="#e9c98a" opacity=".28"/>
<path d="M382 215 C 250 200, 190 260, 120 320" stroke="#c9a24d" stroke-width="2.4" stroke-opacity=".65" fill="none"/>
<path d="M618 215 C 750 200, 810 260, 880 320" stroke="#8b3ff0" stroke-width="2.4" stroke-opacity=".65" fill="none"/>
<path d="M500 333 C 500 400, 470 420, 430 444" stroke="#e9c98a" stroke-width="2" stroke-opacity=".5" fill="none" stroke-dasharray="2 7"/>
<circle cx="120" cy="320" r="5" fill="#e9c98a"/><circle cx="880" cy="320" r="5" fill="#e9c98a"/>
<circle cx="500" cy="215" r="132" fill="none" stroke="#e9c98a" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="2 8"/>
</svg>
<div style="position:absolute;left:50%;top:172px;transform:translate(-50%,-50%);text-align:center">
<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
<div class="hand" style="position:absolute;left:50%;top:318px;transform:translateX(-50%);font-size:22px;color:#e9c98a">say one thing…</div>
<div style="position:absolute;left:40px;top:270px;width:190px;background:#f7f2e6;border-radius:12px;padding:14px;transform:rotate(-3deg);box-shadow:0 16px 36px -12px rgba(5,2,20,.7)">
<div style="font:700 8.5px Sora;letter-spacing:2px;color:#a1641f">YOUR PALETTE</div>
<div style="display:flex;gap:6px;margin-top:9px"><div style="width:26px;height:26px;border-radius:7px;background:#8b3ff0"></div><div style="width:26px;height:26px;border-radius:7px;background:#1e1145"></div><div style="width:26px;height:26px;border-radius:7px;background:#e9c98a"></div><div style="width:26px;height:26px;border-radius:7px;background:#f7f2e6;border:1px solid #ddd"></div></div></div>
<div style="position:absolute;right:40px;top:270px;width:190px;background:#f7f2e6;border-radius:12px;padding:14px;transform:rotate(2.5deg);box-shadow:0 16px 36px -12px rgba(5,2,20,.7)">
<div style="font:700 8.5px Sora;letter-spacing:2px;color:#a1641f">FIRST POST</div>
<div style="font:600 14px/1.3 Fraunces,serif;color:#1e1145;margin-top:7px">Bismillah, <em style="color:#8b3ff0">the first loaf</em> of the day.</div></div>
<div class="hand" style="position:absolute;left:150px;top:220px;font-size:19px;color:#b7a8de;transform:rotate(-8deg)">the ink becomes your brand</div>
</div>
<div style="position:fixed;left:50%;bottom:32px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;color:#8f83b8;font-size:13px">
<span style="border-bottom:1.5px solid rgba(233,201,138,.6);padding:6px 4px;color:#cfc6ee">…or type it here</span><span style="border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px">drop a link</span><span style="border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px">add a photo</span></div>
</body></html>
